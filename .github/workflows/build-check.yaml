name: Candle Build Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.357.0
          cache: true
      - name: Initialize repository dependencies
        run: python scripts/Base/InitializeRepo.py
      - name: Generate Candle Projects and Solution
        run: python scripts/Base/Build.py generate
      - name: Build Candle
        run: python scripts/Base/Build.py build
      - name: Candle Unit tests
        run: python scripts/Base/Build.py test --filter=unit
      - name: Candle Stress tests
        run: python scripts/Base/Build.py test --filter=stress
